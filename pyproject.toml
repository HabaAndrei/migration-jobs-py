[project]
name = "migration-jobs"
version = "0.1.0"
description = "Run-once application jobs for Python + Postgres: generate a file per job, run them all on deploy, and a tracking table guarantees no job runs twice and failed jobs retry"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
]
